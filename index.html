<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sinar Asa</title>

<style>

/* ===== MODE HP ===== */
@media (max-width: 600px){

  header h1{
    font-size:20px;
  }

  .page{
    padding:12px;
  }

  .month{
    padding:10px;
  }

  .calendar-grid{
    gap:3px;
  }

  .day{
    font-size:12px;
    padding:6px;
  }

  button{
    font-size:14px;
    padding:8px;
  }

  footer{
    font-size:20px;
    padding:10px 0;
  }
}


/* ===== DASAR ===== */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Times New Roman", serif;
}

body{
  background:#f4f8ff;
  padding-bottom:120px;
}


/* ===== HEADER ===== */
header{
  background:#1976d2;
  color:white;
  padding:20px;
  text-align:center;
}


/* ===== HALAMAN ===== */
.page{
  display:none;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.page.active{
  display:block;
}


/* ===== HOME ===== */
.home-box{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
}


/* ===== PLAYLIST ===== */
.playlist-box{
  background:white;
  margin-top:20px;
  padding:15px;
  border-radius:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.playlist-box h3{
  color:#1976d2;
  margin-bottom:5px;
  text-align:center;
}

.playlist-box p{
  text-align:center;
  font-size:14px;
  color:#555;
  margin-bottom:10px;
}

.playlist-box ul{
  list-style:none;
}

.playlist-box li{
  padding:8px;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.playlist-box li:last-child{
  border-bottom:none;
}


/* ===== KALENDER ===== */
.month{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:25px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.month h3{
  text-align:center;
  color:#1976d2;
  margin-bottom:10px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  padding:8px;
  text-align:center;
  border-radius:6px;
  font-size:14px;
}

.day.header{
  background:#1976d2;
  color:white;
  font-weight:bold;
}

.sunday{
  color:red;
  font-weight:bold;
}

.holiday{
  background:#ffcdd2;
  color:red;
  font-weight:bold;
}

.international{
  background:#ffe0b2;
  color:#e65100;
  font-weight:bold;
}

.posmar{
  background:#64b5f6;
  color:#0d47a1;
  font-weight:bold;
}


/* ===== FOOTER ===== */
footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#1976d2;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  font-size:22px;
  color:white;
}

footer span{
  cursor:pointer;
}


/* ===== MODE GELAP ===== */
body.dark{
  background:#121212;
  color:white;
}

body.dark .home-box,
body.dark .month,
body.dark .playlist-box{
  background:#1e1e1e;
  color:white;
}

body.dark header,
body.dark footer{
  background:#0d47a1;
}

</style>
</head>


<body>

<!-- ===== HEADER ===== -->
<header>
  <h2>Sinar Asa</h2>
</header>


<!-- ===== HOME ===== -->
<div id="home" class="page active">

  <div class="home-box">

    <div style="position:absolute; top:10px; right:10px;">
      <button
        onclick="toggleTheme()"
        style="padding:6px 10px;border-radius:8px;">
        🌙
      </button>
    </div>

    💙 <b>SINAR ASA</b> 💙
    <br><br>

    Sarana Informasi dan Aspirasi Anak SMANSAR

  </div>


  <!-- ===== PLAYLIST MINGGUAN ===== -->
  <div class="playlist-box">

    <h3>🎵 Playlist Mingguan</h3>

    <p id="playlistWeek"></p>

    <ul id="playlistSongs"></ul>

  </div>

</div>


<!-- ===== KALENDER ===== -->
<div id="calendar" class="page">

  <h2 style="text-align:center;color:#1976d2;margin-bottom:20px;">
    Kalender Tahun 2026
  </h2>

  <div id="calendarContainer"></div>

</div>


<!-- ===== FOOTER ===== -->
<footer id="footerNav">

  <span onclick="showPage('home')">
    🏠
  </span>

  <span onclick="showPage('calendar')">
    📅
  </span>


  <!-- ===== GOOGLE DRIVE ===== -->
  <a
    href="https://drive.google.com/drive/folders/1oNJfsM6q71EyBhA3YoUglF9_flXwupmY"
    target="_blank"
    style="color:white;text-decoration:none;">
    📸
  </a>

</footer>


<!-- ================================================= -->
<!-- ===== JAVASCRIPT KALENDER ======================= -->
<!-- ================================================= -->

<script>

/* ===== PINDAH HALAMAN ===== */

function showPage(id){

  document.querySelectorAll('.page').forEach(p =>
    p.classList.remove('active')
  );

  document.getElementById(id).classList.add('active');

  document.getElementById("footerNav").style.display = "flex";
}


/* ================================================= */
/* ===== LIBUR NASIONAL ============================= */
/* ================================================= */

const holidays={

  "2026-01-01":"Tahun Baru Masehi",
  "2026-01-16":"Isra' Mi'raj Nabi Muhammad",
  "2026-01-31":"Hari Lahir Nahdlatul Ulama (NU)",

  "2026-02-16":"Cuti Bersama Tahun Baru Imlek",
  "2026-02-17":"Tahun Baru Imlek",
  "2026-02-20":"Ramadhan",

  "2026-03-18":"Cuti Bersama Hari Suci Nyepi",
  "2026-03-19":"Hari Suci Nyepi",
  "2026-03-20":"Cuti bersama Hari Raya Idul Fitri",
  "2026-03-21":"Hari Raya Idul Fitri",
  "2026-03-22":"Hari Raya Idul Fitri",
  "2026-03-23":"Hari Raya Idul Fitri",
  "2026-03-24":"Hari Raya Idul Fitri",

  "2026-04-03":"Wafat Isa Al-masih",
  "2026-04-05":"Hari Paskah",
  "2026-04-21":"Hari Kartini",

  "2026-05-01":"Hari Buruh Internasional",
  "2026-05-02":"Hari Pendidikan Nasional",
  "2026-05-14":"Hari Kenaikan Isa Al-masih",
  "2026-05-20":"Hari Kebangkitan Nasional",
  "2026-05-27":"Hari Raya Idhul Adha",
  "2026-05-28":"Hari Raya Idhul Adha",
  "2026-05-31":"Hari Raya Waisak",

  "2026-06-01":"Hari Lahir Pancasila",
  "2026-06-16":"1 Muharram",

  "2026-07-23":"Hari Anak Nasional",

  "2026-08-17":"Hari Kemerdekaan RI",
  "2026-08-25":"Maulid Nabi Muhammad",

  "2026-10-05":"Hari Guru Sedunia",
  "2026-10-12":"Hari Jadi Jawa Timur",
  "2026-10-22":"Hari Santri Nasional",

  "2026-11-09":"Hari Jadi Tuban",
  "2026-11-12":"Hari Ayah Nasional",
  "2026-11-25":"Hari Guru Nasional",

  "2026-12-22":"Hari Ibu Nasional",
  "2026-12-24":"Cuti Hari Raya Natal",
  "2026-12-25":"Hari Raya Natal"

};


/* ================================================= */
/* ===== HARI INTERNASIONAL ========================= */
/* ================================================= */

const internationalDays={

  "2026-01-01":"Tahun Baru Masehi",
  "2026-01-10":"Hari Gerakan Satu Juta Pohon",
  "2026-01-24":"Hari Pendidikan",

  "2026-02-14":"Hari Valentine",

  "2026-03-20":"Hari Kebahagiaan",
  "2026-03-21":"Hari Hutan Sedunia",
  "2026-03-22":"Hari Air Sedunia",
  "2026-03-27":"Hari Teater Sedunia",

  "2026-04-07":"Hari Kesehatan Sedunia",
  "2026-04-22":"Hari Bumi (Earth Day)",
  "2026-04-23":"Hari Buku Sedunia",
  "2026-04-29":"Hari Tari",

  "2026-05-08":"Hari Palang Merah",
  "2026-05-15":"Hari Keluarga",
  "2026-05-22":"Hari Keanekaragaman Hayati",

  "2026-06-01":"Hari Orang Tua Sedunia",
  "2026-06-05":"Hari Lingkungan Hidup Sedunia",
  "2026-06-08":"Hari Laut Sedunia",
  "2026-06-14":"Hari Donor Darah Sedunia",
  "2026-06-26":"Hari Anti Narkoba",

  "2026-07-30":"Hari Persahabatan",

  "2026-08-12":"Hari Remaja",

  "2026-12-01":"Hari AIDS Sedunia",
  "2026-12-10":"Hari Hak Asasi Manusia"

};


/* ================================================= */
/* ===== EVENT POSMAR =============================== */
/* ================================================= */

const posmarEvents={

  "2026-01-22":"Isra' Mi'raj Tahun 2026",
  "2026-01-28":"Expo Campus SPARK",
  "2026-04-28":"Latihan Gabungan PMR"

};


/* ================================================= */
/* ===== DATA KALENDER ============================== */
/* ================================================= */

const months=[
  "Januari",
  "Februari",
  "Maret",
  "April",
  "Mei",
  "Juni",
  "Juli",
  "Agustus",
  "September",
  "Oktober",
  "November",
  "Desember"
];

const days=[
  "Min",
  "Sen",
  "Sel",
  "Rab",
  "Kam",
  "Jum",
  "Sab"
];

const container=document.getElementById("calendarContainer");


/* ===== MEMBUAT KALENDER ===== */

months.forEach((month,m)=>{

  const monthDiv=document.createElement("div");

  monthDiv.className="month";

  monthDiv.innerHTML=`
    <h3>${month} 2026</h3>
  `;


  const grid=document.createElement("div");

  grid.className="calendar-grid";


  /* ===== NAMA HARI ===== */

  days.forEach(d=>{

    grid.innerHTML+=`
      <div class="day header">
        ${d}
      </div>
    `;

  });


  /* ===== HARI PERTAMA ===== */

  const firstDay=
    new Date(2026,m,1).getDay();


  /* ===== JUMLAH HARI ===== */

  const totalDays=
    new Date(2026,m+1,0).getDate();


  /* ===== KOTAK KOSONG ===== */

  for(let i=0;i<firstDay;i++){

    grid.innerHTML+=`
      <div class="day"></div>
    `;

  }


  let h=[];
  let iD=[];
  let p=[];


  /* ===== TANGGAL ===== */

  for(let d=1;d<=totalDays;d++){

    const dateStr=
      `2026-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;


    let cls="day";


    /* ===== MINGGU ===== */

    if(
      new Date(2026,m,d).getDay()===0
    ){

      cls+=" sunday";

    }


    /* ===== LIBUR NASIONAL ===== */

    if(holidays[dateStr]){

      cls+=" holiday";

      h.push(
        `🔴 ${d} ${month} – ${holidays[dateStr]}`
      );

    }


    /* ===== HARI INTERNASIONAL ===== */

    if(internationalDays[dateStr]){

      cls+=" international";

      iD.push(
        `🟠 ${d} ${month} – ${internationalDays[dateStr]}`
      );

    }


    /* ===== EVENT POSMAR ===== */

    if(posmarEvents[dateStr]){

      cls+=" posmar";

      p.push(
        `🔵 ${d} ${month} – ${posmarEvents[dateStr]}`
      );

    }


    grid.innerHTML+=`
      <div class="${cls}">
        ${d}
      </div>
    `;

  }


  monthDiv.appendChild(grid);


  /* ===== CATATAN BULAN ===== */

  if(h.length || iD.length || p.length){

    const note=document.createElement("div");

    note.style.marginTop="10px";


    note.innerHTML=`

      <b style="color:red;">
        🔴 Hari Libur Nasional
      </b>
      <br>
      ${h.join("<br>") || "-"}


      <br><br>


      <b style="color:orange;">
        🟠 Hari Internasional
      </b>
      <br>
      ${iD.join("<br>") || "-"}


      <br><br>


      <b style="color:#1976d2;">
        🔵 Event POSMAR
      </b>
      <br>
      ${p.join("<br>") || "-"}

    `;


    monthDiv.appendChild(note);

  }


  container.appendChild(monthDiv);

});

</script>


<!-- ================================================= -->
<!-- ===== PLAYLIST MINGGUAN ========================= -->
<!-- ================================================= -->

<script>

const weeklyPlaylist = {

  week:
    "Minggu ke-2 (9–13 Februari 2026)",

  songs: [

    "Laskar Pelangi – Nidji",

    "Kisah Kasih Di Sekolah – Chrisye",

    "Ingatlah Hari Ini – Project Pop",

    "Manusia Kuat – Tulus",

    "Tujuh Belas – Tulus"

  ]

};


document.getElementById("playlistWeek").innerText =
  weeklyPlaylist.week;


const list=
  document.getElementById("playlistSongs");


list.innerHTML="";


weeklyPlaylist.songs.forEach(song=>{

  const li=document.createElement("li");

  li.innerHTML="▶ " + song;

  list.appendChild(li);

});

</script>


<!-- ================================================= -->
<!-- ===== MODE GELAP / TERANG ======================= -->
<!-- ================================================= -->

<script>

function toggleTheme(){

  document.body.classList.toggle("dark");


  const isDark=
    document.body.classList.contains("dark");


  localStorage.setItem(
    "theme",
    isDark ? "dark" : "light"
  );

}


/* ===== MEMUAT TEMA SAAT WEB DIBUKA ===== */

window.addEventListener("load",()=>{

  const theme=
    localStorage.getItem("theme");


  if(theme==="dark"){

    document.body.classList.add("dark");

  }

});

</script>


</body>
</html>
