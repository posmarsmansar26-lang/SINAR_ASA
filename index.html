/* ================================================= */
/* ===== DATA BULAN & HARI ========================== */
/* ================================================= */

const months = [
  "Januari",
  "Februari",
  "Maret",
  "April",
  "Mei",
  "Juni",
  "Juli",
  "Agustus",
  "September",
  "Oktober",
  "November",
  "Desember"
];

const days = [
  "Min",
  "Sen",
  "Sel",
  "Rab",
  "Kam",
  "Jum",
  "Sab"
];

const container =
  document.getElementById("calendarContainer");


/* ================================================= */
/* ===== FUNGSI MEMBUAT KALENDER ==================== */
/* ================================================= */

function createCalendar(
  year,
  monthIndex,
  holidayData,
  internationalData,
  posmarData
){

  const month =
    months[monthIndex];


  const monthDiv =
    document.createElement("div");

  monthDiv.className =
    "month";


  monthDiv.innerHTML = `
    <h3>${month} ${year}</h3>
  `;


  const grid =
    document.createElement("div");

  grid.className =
    "calendar-grid";


  /* ===== NAMA HARI ===== */

  days.forEach(day => {

    grid.innerHTML += `
      <div class="day header">
        ${day}
      </div>
    `;

  });


  /* ===== HARI PERTAMA ===== */

  const firstDay =
    new Date(
      year,
      monthIndex,
      1
    ).getDay();


  /* ===== JUMLAH HARI ===== */

  const totalDays =
    new Date(
      year,
      monthIndex + 1,
      0
    ).getDate();


  /* ===== KOTAK KOSONG ===== */

  for(
    let i = 0;
    i < firstDay;
    i++
  ){

    grid.innerHTML += `
      <div class="day"></div>
    `;

  }


  let h = [];
  let iD = [];
  let p = [];


  /* ===== TANGGAL ===== */

  for(
    let d = 1;
    d <= totalDays;
    d++
  ){

    const dateStr =
      `${year}-${String(monthIndex + 1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;


    let cls = "day";


    /* ===== MINGGU ===== */

    if(
      new Date(
        year,
        monthIndex,
        d
      ).getDay() === 0
    ){

      cls += " sunday";

    }


    /* ===== LIBUR NASIONAL ===== */

    if(
      holidayData[dateStr]
    ){

      cls += " holiday";

      h.push(
        `🔴 ${d} ${month} – ${holidayData[dateStr]}`
      );

    }


    /* ===== HARI INTERNASIONAL ===== */

    if(
      internationalData[dateStr]
    ){

      cls += " international";

      iD.push(
        `🟠 ${d} ${month} – ${internationalData[dateStr]}`
      );

    }


    /* ===== EVENT POSMAR ===== */

    if(
      posmarData[dateStr]
    ){

      cls += " posmar";

      p.push(
        `🔵 ${d} ${month} – ${posmarData[dateStr]}`
      );

    }


    grid.innerHTML += `
      <div class="${cls}">
        ${d}
      </div>
    `;

  }


  monthDiv.appendChild(grid);


  /* ===== CATATAN BULAN ===== */

  if(
    h.length ||
    iD.length ||
    p.length
  ){

    const note =
      document.createElement("div");


    note.style.marginTop =
      "10px";


    note.innerHTML = `

      <b style="color:red;">
        🔴 Hari Libur Nasional
      </b>

      <br>

      ${h.join("<br>") || "-"}


      <br><br>


      <b style="color:orange;">
        🟠 Hari Internasional
      </b>

      <br>

      ${iD.join("<br>") || "-"}


      <br><br>


      <b style="color:#1976d2;">
        🔵 Event POSMAR
      </b>

      <br>

      ${p.join("<br>") || "-"}

    `;


    monthDiv.appendChild(note);

  }


  container.appendChild(monthDiv);

}

<script>

function toggleTheme(){

  document.body.classList.toggle("dark");


  const isDark =
    document.body.classList.contains("dark");


  localStorage.setItem(
    "theme",
    isDark ? "dark" : "light"
  );

}


/* ===== MEMUAT TEMA SAAT WEB DIBUKA ===== */

window.addEventListener(
  "load",
  () => {

    const theme =
      localStorage.getItem("theme");


    if(theme === "dark"){

      document.body.classList.add("dark");

    }

  }
);

</script>
